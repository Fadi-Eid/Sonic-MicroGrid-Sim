<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Microgrid Sizer</title>
<meta name="description" content="Hourly simulator and 3D visualiser for an islanded diesel / solar / battery microgrid: sizing, cost and profit.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23eda100'/%3E%3Cg stroke='%23eda100' stroke-width='2.5' stroke-linecap='round'%3E%3Cpath d='M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M26 6l-3 3M9 23l-3 3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./lib/three.module.min.js" } }</script>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="7" fill="var(--c-solar)"/><g stroke="var(--c-solar)" stroke-width="2.5" stroke-linecap="round"><path d="M16 2v4M16 26v4M2 16h4M26 16h4M6 6l3 3M23 23l3 3M26 6l-3 3M9 23l-3 3"/></g></svg>
    Microgrid Sizer
  </div>
  <span id="scenTitle"></span>
  <nav aria-label="Panels">
    <button class="tabbtn" data-tab="params" aria-pressed="false">Parameters</button>
    <button class="tabbtn" data-tab="sizing" aria-pressed="false">Sizing</button>
    <button class="tabbtn" data-tab="results" aria-pressed="false">Results</button>
    <button class="tabbtn" data-tab="risk" aria-pressed="false">Risk</button>
  </nav>
  <div class="spacer"></div>
  <details class="menu" id="fileMenu">
    <summary class="btn">File</summary>
    <div class="menu-pop">
      <button type="button" data-act="open">Open scenario…</button>
      <button type="button" data-act="save">Save scenario</button>
      <button type="button" data-act="reset">Reset to defaults</button>
    </div>
  </details>
  <button class="btn round" id="btnHelp" type="button" title="Manual (H)" aria-label="Open the manual">?</button>
</header>

<div id="main">
  <div id="stage">
    <canvas id="scene" aria-label="3D view of the microgrid. Click a building or machine to open its dashboard."></canvas>
    <div id="loading">Loading simulator…</div>
    <div id="live" aria-live="off"></div>
    <div id="hovertip" hidden></div>
    <div id="busy" hidden>Calculating…</div>
    <div id="hud">
      <button class="btn" id="playBtn" type="button" aria-label="Play or pause">❚❚</button>
      <div class="when" id="when"></div>
      <label class="sl"><span>Day</span><input id="daySl" type="range" min="0" max="364" step="1" aria-label="Day of the year"></label>
      <label class="sl"><span>Hour</span><input id="hourSl" type="range" min="0" max="23.99" step="0.05" aria-label="Hour of the day"></label>
      <select id="speedSel" aria-label="Playback speed">
        <option value="0.5">0.5 h/s</option><option value="2" selected>2 h/s</option><option value="6">6 h/s</option>
        <option value="24">1 day/s</option><option value="96">4 days/s</option>
      </select>
    </div>
  </div>
  <aside id="drawer" hidden aria-label="Details">
    <div class="drawer-head"><div class="title" id="drawerTitle"></div><button class="iconbtn" id="drawerClose" type="button" aria-label="Close panel">✕</button></div>
    <div id="drawerBody"></div>
  </aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script type="module" src="js/main.js"></script>
</body>
</html>
